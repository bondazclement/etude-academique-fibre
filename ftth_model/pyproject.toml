[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftth-model"
version = "1.0.0"
description = "Modelisation economique du deploiement FttH (Zones B/C hors ZTD) — pipeline B0-B3 + notebook"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "polars>=1.0.0",
  "pyarrow>=15.0.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
  "statsmodels>=0.14.0",
  "matplotlib>=3.7.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.1.0",
  "py7zr>=0.21.0",
]

[project.optional-dependencies]
econometrics = ["pyfixest>=0.20.0"]
notebook = ["jupyter>=1.0.0", "ipykernel>=6.25.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
